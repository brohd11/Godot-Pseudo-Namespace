export_root: "res://addons/namespace/_export_ignore/exports"
plugin_folder: "Namespace{{version=res://addons/namespace}}"
pre_script: ""
post_script: ""
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: false
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: true
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      optimizer:
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
        debug_tags: false
        enabled: true
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/namespace"
    export_name: "namespace{{version=res://addons/namespace}}"
    export_folder: addons/namespace
    exclude:
      directories:
        - "res://addons/namespace/_export_ignore"
      file_extensions: []
      files: []
    other_transfers:
      - to: src/plugins/.gdignore
      -
        from: res://addons/namespace/_export_ignore/plugins/
        to: src/plugins/
        recursive: true
        ignore_deps: true
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
    remote_dir: "res://addons/namespace/src/remote"
